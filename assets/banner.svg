<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes slideGradient {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #818cf8; }
      100% { stop-color: #38bdf8; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .orb-1 {
      animation: pulse 6s infinite ease-in-out;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulse 8s infinite ease-in-out 2s;
      transform-origin: 1000px 220px;
    }
    .cursor {
      animation: blink 1s infinite steps(1);
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <!-- Border Highlight -->
  <rect width="1198" height="338" x="1" y="1" rx="17" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Ambient Light Orbs -->
  <circle class="orb-1" cx="220" cy="110" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
  <circle class="orb-2" cx="980" cy="210" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

  <!-- Top Status Pill -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="-110" cy="0" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-95" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AVAILABLE FOR COLLABORATION</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="145" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
    ALBERT VELEZ
  </text>

  <!-- Terminal Style Handle -->
  <g transform="translate(600, 185)">
    <text text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="500">
      <tspan fill="#38bdf8">yakuzokai@github</tspan><tspan fill="#64748b">:</tspan><tspan fill="#a855f7">~</tspan><tspan fill="#64748b">$</tspan> <tspan fill="#f1f5f9">crafting resilient software &amp; embedded systems</tspan><tspan class="cursor" fill="#38bdf8">_</tspan>
    </text>
  </g>

  <!-- Role Subtitle -->
  <text x="600" y="228" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">
    Software Engineer · Full Stack · Systems · Embedded Linux · Cloud Architecture
  </text>

  <!-- Tech Highlights / Badges Bar -->
  <g transform="translate(600, 280)">
    <!-- Pill 1: Mobile & AI -->
    <g transform="translate(-360, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">📱 Mobile &amp; AI</text>
    </g>

    <!-- Pill 2: Microservices -->
    <g transform="translate(-120, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">⚡ Microservices</text>
    </g>

    <!-- Pill 3: Embedded Linux -->
    <g transform="translate(120, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">🐧 Embedded Linux</text>
    </g>

    <!-- Pill 4: Cloud & POS -->
    <g transform="translate(360, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">☁️ Cloud &amp; POS</text>
    </g>
  </g>
</svg>

