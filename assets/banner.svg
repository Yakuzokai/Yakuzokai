<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1013"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Subtle Top Glow -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="subtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <!-- Clip Path for Avatar -->
    <clipPath id="avatarClip">
      <circle cx="115" cy="178" r="44"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .pulse-dot {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="16" fill="url(#subtleGrid)"/>
  <rect width="1200" height="200" rx="16" fill="url(#topGlow)"/>

  <!-- Border -->
  <rect width="1198" height="378" x="1" y="1" rx="15" fill="none" stroke="#27272a" stroke-width="1.2"/>
  <line x1="40" y1="1" x2="1160" y2="1" stroke="#3f3f46" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Top Navigation / Brand Header Bar -->
  <!-- Monogram Box [AV] -->
  <g transform="translate(60, 34)">
    <rect width="36" height="36" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="23" text-anchor="middle" class="font-mono" font-size="14" font-weight="700" fill="#fafafa">AV</text>
    <text x="48" y="24" class="font-sans" font-size="15" font-weight="600" fill="#f4f4f5" letter-spacing="-0.2">Albert Velez</text>
  </g>

  <!-- Availability Pill (Right Aligned) -->
  <g transform="translate(930, 34)">
    <rect width="210" height="36" rx="18" fill="#121316" stroke="#27272a" stroke-width="1"/>
    <circle class="pulse-dot" cx="20" cy="18" r="4.5" fill="#10b981"/>
    <text x="34" y="22" class="font-sans" font-size="12" font-weight="500" fill="#d4d4d8">Available for opportunities</text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="90" x2="1140" y2="90" stroke="#27272a" stroke-width="1"/>

  <!-- Hero Body Section -->
  <!-- Avatar Ring & Image -->
  <g>
    <circle cx="115" cy="178" r="48" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="115" cy="178" r="45" fill="none" stroke="#3f3f46" stroke-width="1"/>
    <image href="data:image/jpeg;base64," x="71" y="134" width="88" height="88" clip-path="url(#avatarClip)"/>
  </g>

  <!-- Eyebrow -->
  <text x="185" y="148" class="font-mono" font-size="11.5" font-weight="600" fill="#71717a" letter-spacing="1.5">
    SOFTWARE ENGINEER • SYSTEM BUILDER
  </text>

  <!-- Hero Name -->
  <text x="185" y="186" class="font-sans" font-size="38" font-weight="800" fill="#fafafa" letter-spacing="-1">
    Albert Velez
  </text>

  <!-- Subtitle / Statement -->
  <text x="185" y="216" class="font-sans" font-size="14.5" font-weight="400" fill="#a1a1aa" letter-spacing="-0.1">
    I design and build software systems across AI, enterprise applications, networking, automation, and developer tooling.
  </text>

  <!-- Divider Above Metrics -->
  <line x1="60" y1="265" x2="1140" y2="265" stroke="#27272a" stroke-width="1"/>

  <!-- Metrics Row (Linear / Vercel style) -->
  <!-- Metric 1 -->
  <g transform="translate(80, 288)">
    <text x="0" y="22" class="font-sans" font-size="22" font-weight="800" fill="#fafafa" letter-spacing="-0.5">20+</text>
    <text x="0" y="42" class="font-mono" font-size="10.5" font-weight="600" fill="#71717a" letter-spacing="1">PROJECTS</text>
  </g>

  <line x1="260" y1="285" x2="260" y2="340" stroke="#222328" stroke-width="1"/>

  <!-- Metric 2 -->
  <g transform="translate(320, 288)">
    <text x="0" y="22" class="font-sans" font-size="22" font-weight="800" fill="#fafafa" letter-spacing="-0.5">6</text>
    <text x="0" y="42" class="font-mono" font-size="10.5" font-weight="600" fill="#71717a" letter-spacing="1">DOMAINS</text>
  </g>

  <line x1="510" y1="285" x2="510" y2="340" stroke="#222328" stroke-width="1"/>

  <!-- Metric 3 -->
  <g transform="translate(570, 288)">
    <text x="0" y="22" class="font-sans" font-size="20" font-weight="800" fill="#fafafa" letter-spacing="-0.5">MULTI-STACK</text>
    <text x="0" y="42" class="font-mono" font-size="10.5" font-weight="600" fill="#71717a" letter-spacing="1">ENGINEERING</text>
  </g>

  <line x1="820" y1="285" x2="820" y2="340" stroke="#222328" stroke-width="1"/>

  <!-- Metric 4 -->
  <g transform="translate(880, 288)">
    <text x="0" y="22" class="font-sans" font-size="20" font-weight="800" fill="#fafafa" letter-spacing="-0.5">FULL-STACK</text>
    <text x="0" y="42" class="font-mono" font-size="10.5" font-weight="600" fill="#71717a" letter-spacing="1">SYSTEMS</text>
  </g>
</svg>
